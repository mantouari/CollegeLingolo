{% extends 'eleves/base.html' %}

{% block title %}{{ titre }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>{{ titre }}</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">{{ bouton }}</button>
            <a href="{% url 'liste_matieres' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
